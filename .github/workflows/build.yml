name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew wrapper jar is checked into this repo (it's a binary this
      # assistant can't fetch offline). This action installs a pinned Gradle
      # directly instead — same result, one less binary to trust blindly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          gradle assembleDebug -PJAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
