name: Aetherwave Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android:
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        name:
          - armeabi-v7a
          - arm64-v8a
          - x86_64
          - universal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Configure Android application
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = re.sub(
              r'namespace\s*=\s*"[^"]+"',
              'namespace = "com.aether.wave"',
              s,
              count=1
          )

          s = re.sub(
              r'applicationId\s*=\s*"[^"]+"',
              'applicationId = "com.aether.wave"',
              s,
              count=1
          )

          loader = '''import java.io.FileInputStream
          import java.util.Properties

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          require(keystorePropertiesFile.exists()) {
              "android/key.properties is required"
          }

          keystoreProperties.load(FileInputStream(keystorePropertiesFile))

          '''

          if "val keystorePropertiesFile = rootProject.file" not in s:
              s = s.replace("android {", loader + "android {", 1)

          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let {
                          rootProject.file(it)
                      }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

          '''

          if 'create("release")' not in s:
              s = s.replace(
                  "    buildTypes {",
                  signing + "    buildTypes {",
                  1
              )

          start = s.find("    buildTypes {")

          if start < 0:
              raise SystemExit("buildTypes block not found")

          depth = 0
          end = -1

          for i in range(start, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end < 0:
              raise SystemExit("Could not parse buildTypes block")

          build_types = '''    buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }'''

          s = s[:start] + build_types + s[end:]

          p.write_text(s)

          required = [
              'namespace = "com.aether.wave"',
              'applicationId = "com.aether.wave"',
              'create("release")',
              'signingConfigs.getByName("release")',
              'isMinifyEnabled = false',
              'isShrinkResources = false',
          ]

          for item in required:
              if item not in s:
                  raise SystemExit("Missing: " + item)

          print("Android release configuration OK")
          PY

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_BASE64: ${{ secrets.RELEASE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -e

          printf '%s' "$LOCAL_PROPERTIES" | base64 --decode > android/key.properties
          printf '%s' "$RELEASE_BASE64" | base64 --decode > android/Aetherwave.jks

          test -s android/key.properties
          test -s android/Aetherwave.jks

          echo "Signing files created successfully"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android release APK
        shell: bash
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
          AUDIOMACK_CONSUMER_KEY: ${{ secrets.AUDIOMACK_CONSUMER_KEY }}
          AUDIOMACK_CONSUMER_SECRET: ${{ secrets.AUDIOMACK_CONSUMER_SECRET }}
          AUDIOMACK_CONSUMER_KEY: ${{ secrets.AUDIOMACK_CONSUMER_KEY }}
          AUDIOMACK_CONSUMER_SECRET: ${{ secrets.AUDIOMACK_CONSUMER_SECRET }}
          OPENVERSE_API_TOKEN: ${{ secrets.OPENVERSE_API_TOKEN }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          case "${{ matrix.name }}" in
            armeabi-v7a)
              TARGET="android-arm"
              ;;
            arm64-v8a)
              TARGET="android-arm64"
              ;;
            x86_64)
              TARGET="android-x64"
              ;;
            universal)
              TARGET=""
              ;;
            *)
              echo "Unknown architecture"
              exit 1
              ;;
          esac

          ARGS=(
            --release
            --no-shrink
            "--dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
            "--dart-define=AUDIUS_API_KEY=$AUDIUS_API_KEY"
            "--dart-define=AUDIOMACK_CONSUMER_KEY=$AUDIOMACK_CONSUMER_KEY"
            "--dart-define=AUDIOMACK_CONSUMER_SECRET=$AUDIOMACK_CONSUMER_SECRET"
            "--dart-define=OPENVERSE_API_TOKEN=$OPENVERSE_API_TOKEN"
            "--dart-define=PODCASTINDEX_API_KEY=$PODCASTINDEX_API_KEY"
            "--dart-define=PODCASTINDEX_API_SECRET=$PODCASTINDEX_API_SECRET"
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          )

          if [ -n "$TARGET" ]; then
            flutter build apk \
              "${ARGS[@]}" \
              --target-platform "$TARGET"
          else
            flutter build apk "${ARGS[@]}"
          fi

          mkdir -p "dist/${{ matrix.name }}"

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

          test -s \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

          ls -lh \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-android-${{ matrix.name }}-release
          path: dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build iOS unsigned release
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
          --dart-define=AUDIUS_API_KEY=${{ secrets.AUDIUS_API_KEY }}
          --dart-define=AUDIOMACK_CONSUMER_KEY=${{ secrets.AUDIOMACK_CONSUMER_KEY }}
          --dart-define=AUDIOMACK_CONSUMER_SECRET=${{ secrets.AUDIOMACK_CONSUMER_SECRET }}
          --dart-define=OPENVERSE_API_TOKEN=${{ secrets.OPENVERSE_API_TOKEN }}
          --dart-define=PODCASTINDEX_API_KEY=${{ secrets.PODCASTINDEX_API_KEY }}
          --dart-define=PODCASTINDEX_API_SECRET=${{ secrets.PODCASTINDEX_API_SECRET }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload iOS unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-ios-unsigned
          path: build/ios/iphoneos/Runner.app
