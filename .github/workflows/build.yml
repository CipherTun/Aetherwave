name: Aetherwave Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android:
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armeabi-v7a
            target: android-arm
          - name: arm64-v8a
            target: android-arm64
          - name: x86_64
            target: android-x64
          - name: universal
            target: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Configure release signing
        env:
          RELEASE_BASE64: ${{ secrets.RELEASE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail
          printf "%s" "$LOCAL_PROPERTIES" | base64 --decode > android/key.properties
          printf "%s" "$RELEASE_BASE64" | base64 --decode > android/Aetherwave.jks
          test -s android/key.properties
          test -s android/Aetherwave.jks

      - name: Configure Android release build
        run: |
          python3 -c "from pathlib import Path; import re; p=Path(\"android/app/build.gradle.kts\"); s=p.read_text(); s=re.sub(r\x27namespace\\s*=\\s*\x22[^\x22]+\x22\x27, \x27namespace = \x22com.aether.wave\x22\x27, s, count=1); s=re.sub(r\x27applicationId\\s*=\\s*\x22[^\x22]+\x22\x27, \x27applicationId = \x22com.aether.wave\x22\x27, s, count=1); loader=\x27import java.io.FileInputStream\\nimport java.util.Properties\\n\\nval keystoreProperties = Properties()\\nval keystorePropertiesFile = rootProject.file(\x22key.properties\")\\nrequire(keystorePropertiesFile.exists()) { \x22android/key.properties is required.\x22 }\\nkeystoreProperties.load(FileInputStream(keystorePropertiesFile))\\n\\n\x27; s=s.replace(\x22android {\x22,loader+\x22android {\x22,1) if \x22val keystorePropertiesFile = rootProject.file\x22 not in s else s; signing=\x27    signingConfigs {\\n        create(\x22release\") {\\n            keyAlias = keystoreProperties.getProperty(\x22keyAlias\")\\n            keyPassword = keystoreProperties.getProperty(\x22keyPassword\")\\n            storeFile = keystoreProperties.getProperty(\x22storeFile\").let { rootProject.file(it) }\\n            storePassword = keystoreProperties.getProperty(\x22storePassword\")\\n        }\\n    }\\n\\n\x27; s=s.replace(\x22    buildTypes {\x22,signing+\x22    buildTypes {\x22,1) if \x27create(\x22release\")\x27 not in s else s; s=re.sub(r\x22    buildTypes \\{.*?\\n    \\}\\n\\}\x22,\x27    buildTypes {\\n        getByName(\x22release\") {\\n            signingConfig = signingConfigs.getByName(\x22release\")\\n            isMinifyEnabled = false\\n            isShrinkResources = false\\n        }\\n    }\\n}\x27,s,count=1,flags=re.S); p.write_text(s); print(\x22[OK] com.aether.wave\"); print(\x22[OK] R8/minification disabled\"); print(\x22[OK] resource shrinking disabled\")"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android release APK
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
          OPENVERSE_API_TOKEN: ${{ secrets.OPENVERSE_API_TOKEN }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ "${{ matrix.target }}" = "universal" ]; then
            flutter build apk --release --no-shrink               --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"               --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"               --dart-define=OPENVERSE_API_TOKEN="$OPENVERSE_API_TOKEN"               --dart-define=PODCASTINDEX_API_KEY="$PODCASTINDEX_API_KEY"               --dart-define=PODCASTINDEX_API_SECRET="$PODCASTINDEX_API_SECRET"               --dart-define=SUPABASE_URL="$SUPABASE_URL"               --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          else
            flutter build apk --release --no-shrink               --target-platform "${{ matrix.target }}"               --dart-define=JAMENDO_CLIENT_ID="$JAMENDO_CLIENT_ID"               --dart-define=AUDIUS_API_KEY="$AUDIUS_API_KEY"               --dart-define=OPENVERSE_API_TOKEN="$OPENVERSE_API_TOKEN"               --dart-define=PODCASTINDEX_API_KEY="$PODCASTINDEX_API_KEY"               --dart-define=PODCASTINDEX_API_SECRET="$PODCASTINDEX_API_SECRET"               --dart-define=SUPABASE_URL="$SUPABASE_URL"               --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi

          mkdir -p "dist/${{ matrix.name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-android-${{ matrix.name }}-release
          path: dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build iOS unsigned release
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
          --dart-define=AUDIUS_API_KEY=${{ secrets.AUDIUS_API_KEY }}
          --dart-define=OPENVERSE_API_TOKEN=${{ secrets.OPENVERSE_API_TOKEN }}
          --dart-define=PODCASTINDEX_API_KEY=${{ secrets.PODCASTINDEX_API_KEY }}
          --dart-define=PODCASTINDEX_API_SECRET=${{ secrets.PODCASTINDEX_API_SECRET }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload iOS unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-ios-unsigned
          path: build/ios/iphoneos/Runner.app
