name: Aetherwave Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  android:
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armeabi-v7a
            target: android-arm
          - name: arm64-v8a
            target: android-arm64
          - name: x86_64
            target: android-x64
          - name: universal
            target: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_BASE64: ${{ secrets.RELEASE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail

          printf '%s' "$LOCAL_PROPERTIES" | base64 --decode > android/key.properties
          printf '%s' "$RELEASE_BASE64" | base64 --decode > android/Aetherwave.jks

          test -s android/key.properties
          test -s android/Aetherwave.jks

          echo "[OK] Signing files created"

      - name: Configure Android release build
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PYCONFIG'
from pathlib import Path
import re

path = Path("android/app/build.gradle.kts")
text = path.read_text()

# Application ID and namespace.
text = re.sub(
    r'namespace\s*=\s*"[^"]+"',
    'namespace = "com.aether.wave"',
    text,
    count=1,
)

text = re.sub(
    r'applicationId\s*=\s*"[^"]+"',
    'applicationId = "com.aether.wave"',
    text,
    count=1,
)

# Keystore configuration.
if "val keystorePropertiesFile = rootProject.file" not in text:
    loader = """import java.io.FileInputStream
import java.util.Properties

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")

require(keystorePropertiesFile.exists()) {
    "android/key.properties is required."
}

keystoreProperties.load(FileInputStream(keystorePropertiesFile))

"""
    text = text.replace("android {", loader + "android {", 1)

# Release signing configuration.
if 'create("release")' not in text:
    signing = """    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties.getProperty("keyAlias")
            keyPassword = keystoreProperties.getProperty("keyPassword")
            storeFile = keystoreProperties.getProperty("storeFile")?.let {
                rootProject.file(it)
            }
            storePassword = keystoreProperties.getProperty("storePassword")
        }
    }

"""
    text = text.replace(
        "    buildTypes {",
        signing + "    buildTypes {",
        1,
    )

# Replace the generated buildTypes block.
pattern = r'    buildTypes\s*\{.*?\n    \}\n\}'

replacement = """    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")

            // R8/minification explicitly disabled.
            isMinifyEnabled = false

            // Resource shrinking explicitly disabled.
            isShrinkResources = false
        }
    }
}"""

text, count = re.subn(
    pattern,
    replacement,
    text,
    count=1,
    flags=re.DOTALL,
)

if count != 1:
    raise SystemExit("ERROR: Could not locate the generated buildTypes block.")

path.write_text(text)

assert 'namespace = "com.aether.wave"' in text
assert 'applicationId = "com.aether.wave"' in text
assert 'isMinifyEnabled = false' in text
assert 'isShrinkResources = false' in text
assert 'signingConfigs.getByName("release")' in text

print("[OK] Application ID: com.aether.wave")
print("[OK] Release signing configured")
print("[OK] R8/minification disabled")
print("[OK] Resource shrinking disabled")
PYCONFIG

          echo
          echo "========== RELEASE CONFIG =========="
          grep -nE \
            'namespace|applicationId|isMinifyEnabled|isShrinkResources|signingConfig' \
            android/app/build.gradle.kts

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Android release APK
        shell: bash
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
          OPENVERSE_API_TOKEN: ${{ secrets.OPENVERSE_API_TOKEN }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          COMMON_ARGS=(
            --release
            --no-shrink
            "--dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
            "--dart-define=AUDIUS_API_KEY=$AUDIUS_API_KEY"
            "--dart-define=OPENVERSE_API_TOKEN=$OPENVERSE_API_TOKEN"
            "--dart-define=PODCASTINDEX_API_KEY=$PODCASTINDEX_API_KEY"
            "--dart-define=PODCASTINDEX_API_SECRET=$PODCASTINDEX_API_SECRET"
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          )

          if [ "${{ matrix.target }}" = "universal" ]; then
            flutter build apk "${COMMON_ARGS[@]}"
          else
            flutter build apk \
              "${COMMON_ARGS[@]}" \
              --target-platform "${{ matrix.target }}"
          fi

          mkdir -p "dist/${{ matrix.name }}"

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

          test -s "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-android-${{ matrix.name }}-release
          path: dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: flutter create --org com.aetherwave --project-name aetherwave --platforms=android,ios .

      - name: Apply platform configuration
        run: python3 tool/setup.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build iOS unsigned release
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
          --dart-define=AUDIUS_API_KEY=${{ secrets.AUDIUS_API_KEY }}
          --dart-define=OPENVERSE_API_TOKEN=${{ secrets.OPENVERSE_API_TOKEN }}
          --dart-define=PODCASTINDEX_API_KEY=${{ secrets.PODCASTINDEX_API_KEY }}
          --dart-define=PODCASTINDEX_API_SECRET=${{ secrets.PODCASTINDEX_API_SECRET }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload iOS unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-ios-unsigned
          path: build/ios/iphoneos/Runner.app
