name: Aetherwave Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:

  android:
    name: Android ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armeabi-v7a
            target: android-arm

          - name: arm64-v8a
            target: android-arm64

          - name: x86_64
            target: android-x64

          - name: universal
            target: universal

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: |
          flutter create \
            --org com.aetherwave \
            --project-name aetherwave \
            --platforms=android,ios \
            .

      - name: Apply Aetherwave platform configuration
        run: |
          python3 tool/setup.py

      - name: Fix Android package
        shell: bash
        run: |
          set -euo pipefail

          MAIN_DIR="android/app/src/main/kotlin"

          MAIN_FILE="$(find "$MAIN_DIR" -type f -name MainActivity.kt | head -n 1)"

          if [ -z "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.kt was not generated."
            exit 1
          fi

          mkdir -p "$MAIN_DIR/com/aether/wave"

          cat > "$MAIN_DIR/com/aether/wave/MainActivity.kt" <<'KOTLIN'
package com.aether.wave

import io.flutter.embedding.android.FlutterActivity

class MainActivity : FlutterActivity()
KOTLIN

          rm -f "$MAIN_FILE"

          echo "[OK] MainActivity package: com.aether.wave"

      - name: Configure Android application ID
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
from pathlib import Path
import re

path = Path("android/app/build.gradle.kts")
text = path.read_text()

text = re.sub(
    r'namespace\s*=\s*"[^"]+"',
    'namespace = "com.aether.wave"',
    text,
    count=1,
)

text = re.sub(
    r'applicationId\s*=\s*"[^"]+"',
    'applicationId = "com.aether.wave"',
    text,
    count=1,
)

path.write_text(text)

if 'namespace = "com.aether.wave"' not in text:
    raise SystemExit("ERROR: namespace was not changed")

if 'applicationId = "com.aether.wave"' not in text:
    raise SystemExit("ERROR: applicationId was not changed")

print("[OK] namespace = com.aether.wave")
print("[OK] applicationId = com.aether.wave")
PY

      - name: Configure release signing
        shell: bash
        env:
          RELEASE_BASE64: ${{ secrets.RELEASE_BASE64 }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_BASE64" ]; then
            echo "ERROR: RELEASE_BASE64 secret is empty."
            exit 1
          fi

          if [ -z "$LOCAL_PROPERTIES" ]; then
            echo "ERROR: LOCAL_PROPERTIES secret is empty."
            exit 1
          fi

          printf '%s' "$LOCAL_PROPERTIES" | base64 --decode > android/key.properties
          printf '%s' "$RELEASE_BASE64" | base64 --decode > android/Aetherwave.jks

          test -s android/key.properties
          test -s android/Aetherwave.jks

          echo "[OK] android/key.properties created"
          echo "[OK] android/Aetherwave.jks created"

      - name: Configure release build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
from pathlib import Path

path = Path("android/app/build.gradle.kts")
text = path.read_text()

if "val keystorePropertiesFile = rootProject.file" not in text:
    loader = '''import java.io.FileInputStream
import java.util.Properties

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")

require(keystorePropertiesFile.exists()) {
    "android/key.properties is required."
}

keystoreProperties.load(FileInputStream(keystorePropertiesFile))

'''

    marker = "android {"

    if marker not in text:
        raise SystemExit("ERROR: android block not found")

    text = text.replace(
        marker,
        loader + marker,
        1,
    )

if 'create("release")' not in text:
    signing = '''    signingConfigs {
        create("release") {
            keyAlias = keystoreProperties.getProperty("keyAlias")
            keyPassword = keystoreProperties.getProperty("keyPassword")
            storeFile = keystoreProperties.getProperty("storeFile")?.let {
                rootProject.file(it)
            }
            storePassword = keystoreProperties.getProperty("storePassword")
        }
    }

'''

    marker = "    buildTypes {"

    if marker not in text:
        raise SystemExit("ERROR: buildTypes block not found")

    text = text.replace(
        marker,
        signing + marker,
        1,
    )

# Replace only the generated buildTypes block.
start = text.find("    buildTypes {")

if start == -1:
    raise SystemExit("ERROR: buildTypes block missing")

depth = 0
end = None

for i in range(start, len(text)):
    if text[i] == "{":
        depth += 1
    elif text[i] == "}":
        depth -= 1
        if depth == 0:
            end = i + 1
            break

if end is None:
    raise SystemExit("ERROR: Could not parse buildTypes block")

replacement = '''    buildTypes {
        getByName("release") {
            signingConfig = signingConfigs.getByName("release")

            isMinifyEnabled = false
            isShrinkResources = false
        }
    }'''

text = text[:start] + replacement + text[end:]

path.write_text(text)

required = [
    'namespace = "com.aether.wave"',
    'applicationId = "com.aether.wave"',
    'create("release")',
    'signingConfigs.getByName("release")',
    'isMinifyEnabled = false',
    'isShrinkResources = false',
]

for item in required:
    if item not in text:
        raise SystemExit(f"ERROR: Missing required configuration: {item}")

print("[OK] Release signing configured")
print("[OK] R8/minification disabled")
print("[OK] Resource shrinking disabled")
PY

          echo
          echo "========== ANDROID RELEASE CONFIG =========="
          grep -nE \
            'namespace|applicationId|create\("release"\)|signingConfig|isMinifyEnabled|isShrinkResources' \
            android/app/build.gradle.kts

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build Android release APK
        shell: bash
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          AUDIUS_API_KEY: ${{ secrets.AUDIUS_API_KEY }}
          OPENVERSE_API_TOKEN: ${{ secrets.OPENVERSE_API_TOKEN }}
          PODCASTINDEX_API_KEY: ${{ secrets.PODCASTINDEX_API_KEY }}
          PODCASTINDEX_API_SECRET: ${{ secrets.PODCASTINDEX_API_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          COMMON_ARGS=(
            --release
            --no-shrink
            "--dart-define=JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID"
            "--dart-define=AUDIUS_API_KEY=$AUDIUS_API_KEY"
            "--dart-define=OPENVERSE_API_TOKEN=$OPENVERSE_API_TOKEN"
            "--dart-define=PODCASTINDEX_API_KEY=$PODCASTINDEX_API_KEY"
            "--dart-define=PODCASTINDEX_API_SECRET=$PODCASTINDEX_API_SECRET"
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
          )

          if [ "${{ matrix.target }}" = "universal" ]; then
            echo "Building UNIVERSAL release APK..."
            flutter build apk "${COMMON_ARGS[@]}"
          else
            echo "Building ${{ matrix.name }} release APK..."
            flutter build apk \
              "${COMMON_ARGS[@]}" \
              --target-platform "${{ matrix.target }}"
          fi

          mkdir -p "dist/${{ matrix.name }}"

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

          test -s \
            "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

          echo
          echo "========== APK CREATED =========="
          ls -lh "dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk"

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-android-${{ matrix.name }}-release
          path: dist/${{ matrix.name }}/aetherwave-${{ matrix.name }}-release.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned release
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate native Flutter project
        run: |
          flutter create \
            --org com.aetherwave \
            --project-name aetherwave \
            --platforms=android,ios \
            .

      - name: Apply Aetherwave platform configuration
        run: python3 tool/setup.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Build iOS unsigned release
        run: >-
          flutter build ios
          --release
          --no-codesign
          --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}
          --dart-define=AUDIUS_API_KEY=${{ secrets.AUDIUS_API_KEY }}
          --dart-define=OPENVERSE_API_TOKEN=${{ secrets.OPENVERSE_API_TOKEN }}
          --dart-define=PODCASTINDEX_API_KEY=${{ secrets.PODCASTINDEX_API_KEY }}
          --dart-define=PODCASTINDEX_API_SECRET=${{ secrets.PODCASTINDEX_API_SECRET }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload iOS unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
